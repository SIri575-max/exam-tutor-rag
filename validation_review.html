<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>茆书 · 第六章验证工作台</title><link rel="stylesheet" href="/assets/katex/katex.min.css"><link rel="stylesheet" href="/math-render.css"><script src="/assets/katex/katex.min.js"></script><script src="/math-render.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#203a46;font:15px/1.8 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1350px;margin:auto;padding:24px}a,summary{color:#17675d}nav,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}nav{border-bottom:1px solid #dce5e6;padding-bottom:15px}h1{font-size:29px;margin:22px 0 5px}h2{font-size:20px}h3{font-size:16px}.muted{font-size:13px;color:#6b7d84}.card{border:1px solid #dce5e6;border-radius:12px;padding:22px;background:white;margin:16px 0}.notice{background:#fff9eb;padding:10px 14px;border-left:3px solid #d0aa50;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}.grid>.card{margin:0}button,select,textarea{font:inherit;color:inherit;border:1px solid #cad8db;border-radius:7px;background:white;padding:7px 11px}button{cursor:pointer}.primary{background:#17675d;color:white}button:disabled{opacity:.5}.prose{white-space:pre-wrap;line-height:1.95;overflow-wrap:anywhere}textarea{width:100%;min-height:85px;margin:12px 0}select{max-width:100%}.image{max-height:65vh;overflow:auto}.image img{width:100%}.sources button{margin:4px;font-size:12px}.candidate{border-top:1px solid #dce5e6;padding:12px 0}#progress{color:#17675d}.judgement{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.judgement label{display:grid;gap:6px;font-size:13px}.badge{background:#edf4f0;border-radius:15px;padding:3px 10px;font-size:12px}#error{color:#a63434}details{margin:10px 0}summary{cursor:pointer}#checklist{display:flex;gap:5px;flex-wrap:wrap}#checklist button{font-size:12px;padding:4px 8px}.chosen{outline:2px solid #17675d}@media(max-width:800px){main{padding:15px}.grid,.judgement{grid-template-columns:1fr}h1{font-size:25px}.card{padding:17px}}
</style><main><nav><strong>茆书 / 第六章验证工作台</strong><div class="row"><a href="/problems">题目检索</a><a href="/library">全书阅读</a><a href="/syllabus" target="_blank">考纲图谱计划</a></div></nav>
<h1>先核对证据，再确认关联。</h1><p class="muted">首批20道参数估计题 · 原题、公式、候选考点和相关练习分开审核。</p>
<p class="notice">所有题目默认待审核。请对照原页判断题干、考点和练习条件是否匹配；审核结果保存在本机，保留每次修改记录。</p>
<section class="card"><div class="row"><strong id="progress">正在读取批次…</strong><div><button id="previous">上一题</button> <button id="next">下一题</button></div></div><div id="checklist"></div><p class="muted" id="materials"></p></section>
<p id="error" role="alert"></p><div class="grid"><section class="card"><span id="position" class="badge"></span><h2 id="title"></h2><p class="muted" id="flags"></p><div id="stem" class="prose"></div><div id="pages" class="sources"></div><details><summary>展开原例讲解 / 完整题目</summary><button id="full">载入原始内容</button><div id="fulltext" class="prose"></div></details><h3>候选考点线索</h3><div id="topics"></div><details><summary>对应教材条目（候选）</summary><div id="readings"></div></details><h3>相关练习候选</h3><div id="practice"></div></section>
<section class="card"><div class="row"><h2 id="page-title">教材原页</h2><a id="page-link" target="_blank">全书阅读中打开</a></div><div class="image"><img id="source" alt="教材原页，供核对题干与公式"></div><p class="muted">本轮以教材原页为核对依据。新增讲义尚未完成逐题OCR对齐，不将其文本层当作可靠题解。</p></section></div>
<section class="card"><h2>记录这道题的审核意见</h2><div class="judgement"><label>① 题干与公式<select id="stem-verdict"></select></label><label>② 考点关联<select id="topic-verdict"></select></label><label>③ 相关练习<select id="practice-verdict"></select></label></div><textarea id="notes" placeholder="需修改时写清题号、缺失条件或错误关联；不确定也可以说明原因。"></textarea><div class="row"><div><button class="primary" id="save">保存本机审核</button> <button id="reset">撤销未保存修改</button></div><span id="save-status" class="muted" aria-live="polite"></span></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let batch,index=0,dirty=false;
const links=ps=>(ps||[]).map(p=>'<button data-page="'+p+'">PDF '+p+'</button>').join('');
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return MathView.register(d)}
const options='<option value="">待审核 · 请选择</option><option value="pass">通过</option><option value="needs_changes">需要修改</option><option value="unsure">不确定 / 暂缓</option>';
for(const k of ['stem','topic','practice'])$(k+'-verdict').innerHTML=options;
function source(p){$('source').src='/book-page/'+p+'.png';$('page-title').textContent='教材原页 · PDF '+p;$('page-link').href='/library#page='+p}
function show(n){if(dirty){$('error').textContent='当前意见尚未保存，请先保存后切换题目。';return}index=n;const r=batch.items[n],review=batch.latest_reviews[r.id];$('error').textContent='';$('position').textContent=(n+1)+' / '+batch.items.length+' · '+(review?'已有本机审核记录':'待审核');$('title').textContent=r.label;$('flags').textContent=r.review_flags.join('；');$('stem').innerHTML=MathView.prose(r.question_text);$('pages').innerHTML=links(r.pages);$('fulltext').innerHTML='';$('full').disabled=false;$('topics').innerHTML=(r.topic_candidates||[]).map(t=>'<span class="badge">'+esc(t.label)+'</span>').join(' ')||'<p class="muted">未提取到显式考点词，不能据此断言题目没有考点。</p>';$('readings').innerHTML=(r.reading_candidates||[]).map(v=>'<h3>'+MathView.prose(v.title)+'</h3><div class="prose">'+MathView.prose(v.text)+'</div>'+links(v.pages)).join('');$('practice').innerHTML=r.practice_candidates.map(v=>'<div class="candidate"><strong>'+esc(v.label)+'</strong><details><summary>核对候选题条件</summary><div class="prose">'+MathView.prose(v.question_text)+'</div>'+links(v.pages)+'</details></div>').join('');for(const k of ['stem','topic','practice'])$(k+'-verdict').value=review?.verdicts[k]||'';$('notes').value=review?.notes||'';$('save-status').textContent='';$('previous').disabled=n===0;$('next').disabled=n===batch.items.length-1;$('progress').textContent='已记录 '+Object.keys(batch.latest_reviews).length+' / '+batch.items.length+' 题 · 内容判断仍由你审核';$('checklist').innerHTML=batch.items.map((v,i)=>'<button data-index="'+i+'" class="'+(i===n?'chosen':'')+'">'+(i+1)+(batch.latest_reviews[v.id]?' ✓':'')+'</button>').join('');source(r.pages[0]);}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)source(Number(p.dataset.page));const i=e.target.closest('[data-index]');if(i)show(Number(i.dataset.index))});
$('reset').onclick=()=>{dirty=false;show(index)};
$('previous').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);for(const k of ['stem','topic','practice'])$(k+'-verdict').onchange=()=>dirty=true;$('notes').oninput=()=>dirty=true;
$('full').onclick=async()=>{const b=$('full');b.disabled=true;try{const recordId=batch.items[index].id;const d=await api('/api/problem-record?id='+encodeURIComponent(recordId));if(batch.items[index].id!==recordId)return;$('fulltext').innerHTML=MathView.prose(d.full_text)}catch(e){$('error').textContent=e.message;b.disabled=false}};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;try{const verdicts=Object.fromEntries(['stem','topic','practice'].map(k=>[k,$(k+'-verdict').value]));const d=await api('/api/validation-review',{batch_id:batch.batch_id,collection_sha256:batch.collection_sha256,record_id:batch.items[index].id,verdicts,notes:$('notes').value});batch.latest_reviews[d.review.record_id]=d.review;dirty=false;show(index);$('save-status').textContent=d.message}catch(e){$('error').textContent=e.message}finally{b.disabled=false}};
api('/api/validation-review').then(d=>{batch=d;show(0)}).catch(e=>$('error').textContent=e.message);
api('/api/validation-sources').then(d=>$('materials').textContent='讲义已登记 '+d.files+' 份 / '+d.pages+' 页；尚未完成逐题检索对齐。考纲计划：'+d.syllabus_topics+'个主节点；教材候选映射待审。').catch(e=>$('materials').textContent=e.message);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></html>
